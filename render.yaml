# Optional blueprint. Review current free-plan quotas; this file does not deploy or enable billing.
services:
  - type: web
    name: saly-intelligence
    runtime: docker
    plan: free
    healthCheckPath: /api/bootstrap
    envVars:
      - key: SALY_DATABASE_URL
        sync: false
      - key: SALY_OWNER_PASSWORD_HASH
        sync: false
      - key: SALY_LLM_API_KEY
        sync: false
      - key: SALY_LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: SALY_MODEL
        value: llama-3.3-70b-versatile
      - key: SALY_SECURE_COOKIE
        value: '1'
