name: SALY checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: saly_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SALY_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/saly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/install.sh
      - run: bash scripts/test.sh
      - run: .venv/bin/pip install -r backend/requirements-browser.txt
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - name: Browser integration
        run: |
          SALY_CHROMIUM_PATH="$(.venv/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" .venv/bin/python scripts/browser_smoke.py
